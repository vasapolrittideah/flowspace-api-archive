version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - dupword
    - errorlint
    - gocritic
    - godoclint
    - godot
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - protogetter
    - rowserrcheck
    - spancheck
    - sqlclosecheck
  settings:
    depguard:
      # ADR-0009: services never import one another; the compiler already
      # enforces it for anything under internal/, and this is the net for
      # packages created outside it. One rule per service, added with the
      # service:
      #
      #   identity:
      #     files: ["**/services/identity/**"]
      #     deny:
      #       - pkg: github.com/vasapolrittideah/flowspace-api/services
      #         desc: cross-service import; talk through proto/ instead
      #     allow:
      #       - github.com/vasapolrittideah/flowspace-api/services/identity
      rules:
        pkg-is-infrastructure-only:
          files: ["**/pkg/**"]
          deny:
            - pkg: github.com/vasapolrittideah/flowspace-api/services
              desc: pkg/ holds infrastructure, never domain types (ADR-0009)

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vasapolrittideah/flowspace-api
