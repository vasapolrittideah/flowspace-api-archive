name: ci

on:
  pull_request:
    # `edited` fires when the title or body changes. Both become the commit
    # message on main under squash merging, so both are worth rechecking;
    # without it a title can be edited to anything after the checks go green.
    types: [opened, synchronize, reopened, edited]
    paths-ignore: ["deploy/**"]
  push:
    branches: [main]
    paths-ignore: ["deploy/**"]

# Deployment commits are written by CI itself (ADR-0011); reacting to them
# would make the pipeline trigger itself.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-adr.sh

  depguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # There is no go.sum to key a cache on until the first service lands.
          cache: false
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: .github/scripts/check-depguard.sh

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Passed as environment variables: a title interpolated into `run`
      # would be a script injection.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/check-pr-title.sh
